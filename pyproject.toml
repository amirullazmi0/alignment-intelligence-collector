# Collector dijalankan sebagai aplikasi, bukan dipasang sebagai pustaka, jadi tidak ada
# build-system maupun konfigurasi packaging di sini. Berkas ini hanya menyimpan daftar
# dependensi dan pengaturan perkakas. Pola yang sama dipakai alignment-intelligence-python.

[project]
name = "alignment-intelligence-collector"
version = "1.0.0"
description = "Kolektor regulasi JDIHN untuk Alignment Intelligence"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11,<4",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "selectolax>=0.3.28,<1",
    "tenacity>=9,<10",
    "truststore>=0.10,<1",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
# Hanya kode aplikasi. Test memakai kwargs beralias milik pydantic-settings yang sah
# saat runtime tapi tidak terlihat oleh mypy.
files = ["app"]

# asyncpg dan apscheduler tidak menyertakan type stub. Diabaikan per modul supaya
# `strict` tetap berlaku penuh untuk kode kita sendiri.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "apscheduler.*"]
ignore_missing_imports = true
